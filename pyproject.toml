[project]
name = "ml-basic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JC-Yu", email = "yjc165659@gmail.com" }
]
requires-python = ">=3.10, <3.11"
dependencies = [
    "gymnasium==1.3.0",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "numpy==1.26.4",
    "packaging>=26.3",
    "pygame>=2.6.1",
    "setuptools>=84.0.0",
    "torch==2.1.0",
]

[project.scripts]
ml-basic = "ml_basic:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
